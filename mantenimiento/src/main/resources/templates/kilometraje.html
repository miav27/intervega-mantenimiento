<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Kilometraje - InterVega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar barra-superior navbar-dark px-3">
        <span class="navbar-brand mb-0 h1">InterVega - Mantenimiento</span>
        <!-- Cierra la sesión: debe ser POST para que Spring valide el token CSRF -->
<form th:action="@{/logout}" method="post" style="margin:0; margin-left:auto;">
    <button type="submit"
            style="background:transparent; border:1px solid #fff; color:#fff;
                   padding:6px 14px; border-radius:6px; cursor:pointer;">
        Cerrar sesión
    </button>
</form>
    </nav>

    <div class="container my-4">
        <h2 class="h4 mb-3">Registro de Kilometraje</h2>

        <form class="row g-3 mb-4" th:action="@{/kilometraje}" method="post">
            <div class="col-md-3">
                <label for="placa" class="form-label">Placa</label>
                <input type="text" class="form-control" id="placa" name="placa" required>
            </div>
            <div class="col-md-3">
                <label for="kilometraje" class="form-label">Kilometraje actual</label>
                <input type="number" class="form-control" id="kilometraje" name="kilometraje" min="0" required>
            </div>
            <div class="col-md-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-primario w-100">Registrar</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Placa</th>
                        <th>Kilometraje</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Fila de ejemplo; luego se reemplaza con th:each -->
                    <tr>
                        <td>ABC-123</td>
                        <td>45,200 km</td>
                        <td>2026-10-20</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
