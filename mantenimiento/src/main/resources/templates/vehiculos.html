<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehículos - InterVega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <!-- Barra superior -->
    <nav class="navbar navbar-expand barra-superior navbar-dark px-3">
        <span class="navbar-brand mb-0 h1">InterVega - Mantenimiento</span>
        <!-- Cierra la sesión: debe ser POST para que Spring valide el token CSRF -->
<form th:action="@{/logout}" method="post" style="margin:0; margin-left:auto;">
    <button type="submit"
            style="background:transparent; border:1px solid #fff; color:#fff;
                   padding:6px 14px; border-radius:6px; cursor:pointer;">
        Cerrar sesión
    </button>
</form>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/kilometraje}">Kilometraje</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/vehiculos}">Vehículos</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </nav>

    <div class="container my-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h2 class="h4 mb-0">Flota de vehículos</h2>
                <small class="text-muted" th:text="${#lists.size(vehiculos)} + ' vehículo(s) registrado(s)'">0 vehículo(s) registrado(s)</small>
            </div>
            <input type="search" id="buscarPlaca" class="form-control" style="max-width: 260px;"
                   placeholder="Buscar por placa...">
        </div>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover align-middle mb-0" id="tablaVehiculos">
                <thead class="table-dark">
                    <tr>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Año</th>
                        <th class="text-end">Kilometraje</th>
                        <th>Taller</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vehiculos}">
                        <td class="fw-semibold" th:text="${v.placa}">ABC-123</td>
                        <td th:text="${v.marca}">Volvo</td>
                        <td th:text="${v.modelo}">FH</td>
                        <td th:text="${v.anio}">2020</td>
                        <td class="text-end" th:text="${#numbers.formatInteger(v.kilometrajeActual, 1, 'COMMA')} + ' km'">45,200 km</td>
                        <td th:text="${v.taller.nombre}">Taller</td>
                        <td>
                            <!-- Colores tipo semáforo: verde = activo, amarillo = en taller, gris = baja -->
                            <span class="badge"
                                  th:classappend="${v.estado == 'ACTIVO'} ? 'bg-success' : (${v.estado == 'EN_TALLER'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                  th:text="${v.estado == 'EN_TALLER'} ? 'En taller' : (${v.estado == 'BAJA'} ? 'Baja' : 'Activo')">Activo</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vehiculos)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay vehículos registrados todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Filtro por placa en la misma tabla
        document.getElementById('buscarPlaca').addEventListener('input', function () {
            var texto = this.value.toLowerCase();
            document.querySelectorAll('#tablaVehiculos tbody tr').forEach(function (fila) {
                fila.style.display = fila.textContent.toLowerCase().includes(texto) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
