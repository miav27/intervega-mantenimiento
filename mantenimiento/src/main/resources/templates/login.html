<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - InterVega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="fondo-login">
    <main class="contenedor-login">
        <div class="card tarjeta-login shadow">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-1">Transportes InterVega SAC</h1>
                <p class="text-center text-muted mb-4">Sistema de Gestión de Mantenimiento Vehicular</p>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="alert alert-danger py-2" th:if="${param.error}">
                        Usuario o contraseña incorrectos.
                    </div>
                    <button type="submit" class="btn btn-primario w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
